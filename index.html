<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>台灣生存戰 - 台北生存島</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @keyframes pulseFast {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.85; transform: scale(0.98); }
    }
    .animate-pulse-fast { animation: pulseFast 1s infinite ease-in-out; }
    .custom-scrollbar::-webkit-scrollbar { width: 4px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.6); }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(51, 65, 85, 0.8); border-radius: 4px; }
    .hit-active { background-color: rgba(239, 68, 68, 0.25); box-shadow: inset 0 0 50px rgba(239, 68, 68, 0.5); transition: all 0.1s ease; }
    .drag-over-yellow { background-color: rgba(234, 179, 8, 0.15) !important; border-style: dashed !important; border-color: rgb(234, 179, 8) !important; }
    .drag-over-red { background-color: rgba(239, 68, 68, 0.2) !important; border-style: dashed !important; border-color: rgb(239, 68, 68) !important; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans select-none overflow-hidden h-[100dvh] flex flex-col items-center justify-center">

  <!-- 手機外框容器 -->
  <div class="relative w-full max-w-md h-full max-h-[900px] bg-slate-900 border border-slate-800 shadow-2xl flex flex-col overflow-hidden">

    <!-- 🔴 紅色防禦觸發區 (用於拖曳道具直接使用/裝備) -->
    <div id="drop-zone-red" ondragover="handleDragOverRed(event)" ondragleave="handleDragLeaveRed(event)" ondrop="handleDropToRed(event)" class="absolute top-0 left-0 w-full h-2 pointer-events-none z-40"></div>

    <!-- 頂部資訊列 -->
    <div class="bg-slate-950 px-4 py-2.5 border-b border-slate-800 flex justify-between items-center z-20 flex-shrink-0">
      <div>
        <div id="player-name" class="text-sm font-black text-amber-400 tracking-wide">載入中...</div>
        <div id="player-stats" class="text-[10px] text-slate-400 font-mono">攻擊 0 | 防禦 0</div>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="openCraftBookModal()" class="px-2.5 py-1 bg-indigo-900/80 hover:bg-indigo-800 border border-indigo-600/60 rounded-lg text-xs font-bold text-indigo-200 transition shadow">
          📖 圖鑑
        </button>
      </div>
    </div>

    <!-- 主遊戲畫面區 -->
    <div id="explore-panel" ondragover="handleDragOverYellow(event)" ondragleave="handleDragLeaveYellow(event)" ondrop="handleDropToYellow(event)" class="relative flex-1 flex flex-col p-4 overflow-hidden bg-slate-950/60">
      
      <!-- 🎯【核心修復】：左上角即時目標追蹤盒 DOM 元素 -->
      <div id="target-tracker-box" class="hidden absolute top-2 left-2 z-30 bg-slate-900/90 border border-slate-700 rounded-xl p-2 w-48 shadow-lg"></div>

      <!-- 血量與體力條 -->
      <div class="space-y-2 mb-3 z-10 flex-shrink-0">
        <div>
          <div class="flex justify-between text-[11px] font-bold mb-0.5">
            <span class="text-rose-400">生命值 (HP)</span>
            <span id="hp-text" class="font-mono">100/100</span>
          </div>
          <div class="w-full bg-slate-800 h-2.5 rounded-full overflow-hidden p-0.5 border border-slate-700">
            <div id="hp-bar" class="bg-rose-500 h-full rounded-full transition-all duration-300" style="width: 100%;"></div>
          </div>
        </div>
        <div>
          <div class="flex justify-between text-[11px] font-bold mb-0.5">
            <span class="text-amber-400">體力值 (SP)</span>
            <span id="sp-text" class="font-mono">100/100</span>
          </div>
          <div class="w-full bg-slate-800 h-2.5 rounded-full overflow-hidden p-0.5 border border-slate-700">
            <div id="sp-bar" class="bg-amber-400 h-full rounded-full transition-all duration-300" style="width: 100%;"></div>
          </div>
        </div>
      </div>

      <!-- 當前位置與地圖開關按鈕 -->
      <div class="bg-slate-900/90 border border-slate-800 rounded-2xl p-3 mb-3 flex justify-between items-center z-10 flex-shrink-0 shadow-md">
        <div>
          <div class="text-[10px] text-slate-400 font-mono tracking-widest uppercase">目前位置</div>
          <div id="zone-title" class="text-base font-black text-slate-100 flex items-center gap-1.5 mt-0.5">🏛️ 立法院</div>
          <div id="zone-drops" class="text-[10px] text-amber-300/90 font-mono mt-0.5 truncate max-w-[220px]">可搜刮：載入中...</div>
        </div>
        <button onclick="openMapModal()" class="px-3 py-2 bg-sky-600 hover:bg-sky-500 active:scale-95 text-white font-black rounded-xl text-xs transition shadow-lg flex items-center gap-1">
          <span>🗺️ 地圖</span>
        </button>
      </div>

      <!-- 戰鬥或探索動態訊息記錄夾 -->
      <div class="flex-1 bg-slate-950 border border-slate-800/80 rounded-2xl p-3 overflow-y-auto custom-scrollbar flex flex-col-reverse space-y-reverse space-y-2 mb-3 text-xs shadow-inner" id="game-log">
        <div class="text-slate-500 italic">歡迎來到台灣生存戰，請點擊下方按鈕開始搜刮物資...</div>
      </div>

      <!-- 快速合成提示橫幅 -->
      <div id="craft-alert-box" class="hidden mb-2 flex-shrink-0 z-10"></div>

      <!-- 搜刮進度條 -->
      <div id="search-progress-box" class="hidden mb-2 bg-slate-900 border border-slate-700 rounded-xl p-2 flex-shrink-0 z-10">
        <div class="flex justify-between text-[11px] font-bold mb-1">
          <span id="search-prompt-text" class="text-amber-400">🔍 搜刮中...</span>
        </div>
        <div class="w-full bg-slate-800 h-2 rounded-full overflow-hidden">
          <div id="search-progress-bar" class="bg-amber-400 h-full transition-all duration-100" style="width: 0%;"></div>
        </div>
      </div>

      <!-- 底部控制按鈕：搜刮 -->
      <div class="flex gap-2 flex-shrink-0 z-10">
        <button onclick="triggerSearch()" class="flex-1 py-3 bg-amber-500 hover:bg-amber-400 active:scale-98 text-slate-950 font-black rounded-2xl text-sm transition shadow-lg flex items-center justify-center gap-1.5">
          <span>🔍 搜刮周遭 (-15 體力)</span>
        </button>
      </div>
    </div>

    <!-- 底部固定：6格裝備欄與 6格背包欄 -->
    <div class="bg-slate-950 border-t border-slate-800 p-3 flex gap-3 flex-shrink-0 z-20">
      <!-- 6格裝備欄 -->
      <div class="w-24 grid grid-cols-2 gap-1" id="equip-six-grid"></div>
      <!-- 6格背包欄 -->
      <div class="flex-1 grid grid-cols-3 gap-1.5" id="inventory-grid"></div>
    </div>

  </div>

  <!-- 🗺️ 全島 22 區地圖 Modal -->
  <div id="map-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 w-full max-w-md h-[80vh] rounded-3xl flex flex-col overflow-hidden shadow-2xl">
      <div class="px-5 py-4 border-b border-slate-800 flex justify-between items-center bg-slate-950">
        <div>
          <div class="text-sm font-black text-amber-400">🗺️ 台北生存島 (22區全覽)</div>
          <div class="text-[10px] text-slate-400">點擊島嶼地標直接前往 (-5 體力)</div>
        </div>
        <button onclick="closeMapModal()" class="px-3 py-1 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl text-xs font-bold">關閉 ✕</button>
      </div>
      <div class="flex-1 p-4 relative overflow-hidden flex items-center justify-center" id="map-nodes-container"></div>
      <div class="bg-slate-950 border-t border-slate-800 px-4 py-2.5 flex justify-around text-[10px] font-bold text-slate-400">
        <div class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-full bg-sky-500"></span>目前位置</div>
        <div class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-full bg-amber-400 animate-pulse"></span>目標產地</div>
        <div class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-full bg-rose-600"></span>禁區</div>
      </div>
    </div>
  </div>

  <!-- 📖 全物資圖鑑與合成 Modal -->
  <div id="craft-book-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 w-full max-w-md h-[85vh] rounded-3xl flex flex-col overflow-hidden shadow-2xl">
      <div class="px-5 py-4 border-b border-slate-800 flex justify-between items-center bg-slate-950">
        <div class="text-sm font-black text-indigo-400">📖 台灣生存物資圖鑑</div>
        <button onclick="closeCraftBookModal()" class="px-3 py-1 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl text-xs font-bold">關閉 ✕</button>
      </div>
      <!-- 品級分頁 -->
      <div class="grid grid-cols-6 gap-1 p-2 bg-slate-950 border-b border-slate-800 text-center text-xs font-bold">
        <button id="craft-tab-all" onclick="filterCraftBook('all')" class="py-1.5 rounded-lg bg-indigo-600 text-white transition">全部</button>
        <button id="craft-tab-1" onclick="filterCraftBook(1)" class="py-1.5 rounded-lg bg-slate-800 text-slate-300 transition">普通</button>
        <button id="craft-tab-2" onclick="filterCraftBook(2)" class="py-1.5 rounded-lg bg-slate-800 text-emerald-400 transition">精良</button>
        <button id="craft-tab-3" onclick="filterCraftBook(3)" class="py-1.5 rounded-lg bg-slate-800 text-sky-400 transition">稀有</button>
        <button id="craft-tab-4" onclick="filterCraftBook(4)" class="py-1.5 rounded-lg bg-slate-800 text-amber-300 transition">史詩</button>
        <button id="craft-tab-5" onclick="filterCraftBook(5)" class="py-1.5 rounded-lg bg-slate-800 text-rose-400 transition">傳說</button>
      </div>
      <div class="flex-1 p-3 overflow-y-auto custom-scrollbar space-y-2.5" id="craft-recipes-list"></div>
    </div>
  </div>

  <!-- 🔍 物品詳細資訊與合成樹 Modal -->
  <div id="item-info-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 w-full max-w-sm rounded-3xl p-5 flex flex-col space-y-3 shadow-2xl">
      <div class="flex justify-between items-start">
        <div>
          <div id="info-item-category" class="text-[10px] font-mono text-slate-400 uppercase tracking-widest">物品情報</div>
          <div id="info-item-name" class="text-base font-black text-slate-100 mt-0.5">物品名稱</div>
          <div id="info-item-stat" class="text-xs font-mono font-bold text-amber-400 mt-0.5">屬性加成</div>
        </div>
        <button onclick="closeItemInfoModal()" class="text-slate-400 hover:text-white text-base px-2">✕</button>
      </div>
      <div id="info-item-desc" class="text-xs text-slate-300 bg-slate-950 p-2.5 rounded-xl border border-slate-800 leading-relaxed">物品說明敘述...</div>
      <div id="info-buttons-container" class="space-y-2 pt-1"></div>
    </div>
  </div>

  <!-- 引入遊戲各個模組腳本 (版本號統一更新為 v=102 確保無快取) -->
  <script src="items_weapon.js?v=102"></script>
  <script src="items_armor.js?v=102"></script>
  <script src="items_material.js?v=102"></script>
  <script src="items_food.js?v=102"></script>
  <script src="recipes.js?v=102"></script>
  <script src="maps.js?v=102"></script>
  <script src="characters.js?v=102"></script>
  <script src="game_config.js?v=102"></script>
  
  <script src="lobby.js?v=102"></script>
  <script src="ai.js?v=102"></script>
  <script src="combat.js?v=102"></script>
  <script src="main.js?v=102"></script>

  <script>
    window.addEventListener("DOMContentLoaded", () => {
      if (typeof initGame === 'function') {
        initGame("normal", "zhugouliang");
      }
    });
  </script>
</body>
</html>
